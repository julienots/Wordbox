name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web (debug) and sync Android
        run: npm run build:debug && npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aeonis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release APK + AAB (only if signing secrets are configured)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/aeonis-release.jks
          printf 'storeFile=../aeonis-release.jks\nstorePassword=%s\nkeyAlias=aeonis\nkeyPassword=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > android/keystore.properties
          npm run build && npx cap sync android
          cd android && ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: aeonis-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
